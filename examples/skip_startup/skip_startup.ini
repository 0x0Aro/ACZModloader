[skip_startup]
; Skip the startup presentation before the title screen.
enabled=true

; CModeWakeLogo: publisher / legal / wake logos.
logos=true

; ModeMoviePlay instances before the title screen.
; This includes the opening movie; later story movies still play.
startup_movies=true

; ModeGameControl at startup: control-scheme confirmation.
; The normal control settings menu remains available after the title screen.
control_scheme=true
