name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: make clean all

      - name: Verify executable
        shell: msys2 {0}
        run: |
          ls -l build/ACZModLoader.exe
          test -s build/ACZModLoader.exe
          objdump -p build/ACZModLoader.exe | grep 'DLL Name'
          if objdump -p build/ACZModLoader.exe | grep -Eq 'DLL Name: (libwinpthread|libstdc\+\+|libgcc)'; then
            echo "Unexpected MinGW runtime dependency in ACZModLoader.exe"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/ACZModLoader.exe
          generate_release_notes: true
