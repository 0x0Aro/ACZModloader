name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /O2 /EHsc /MT /utf-8 /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /FI stdint.h /Fo:build\mod_loader.obj /Fe:build\ACZModLoader.exe src\mod_loader.cpp /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /ENTRY:wWinMainCRTStartup shell32.lib user32.lib
          if errorlevel 1 exit /b 1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/ACZModLoader.exe')) {
            throw 'ACZModLoader.exe was not produced'
          }
          $deps = dumpbin /dependents build/ACZModLoader.exe | Out-String
          Write-Host $deps
          if ($deps -match 'libwinpthread|libstdc\+\+|libgcc|vcruntime|msvcp') {
            throw 'ACZModLoader.exe still has a dynamically linked runtime dependency'
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/ACZModLoader.exe
          generate_release_notes: true
